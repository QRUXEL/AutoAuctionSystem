; First flash over USB (or the browser flasher), then update over Wi-Fi:
;   pio run -e esp32s3 -t upload        USB
;   pio run -e ota -t upload            Wi-Fi (same network as the ESP32)

[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; two app slots for OTA; 4 MB layout so it also fits 4 MB boards
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
lib_deps =
    h2zero/NimBLE-Arduino@~1.4.3
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
extra_scripts = post:merge_bin.py

[env:ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = auction-station.local   ; or the IP printed at boot
upload_flags =
    --auth=change-me                  ; = OTA_PASSWORD in include/config.h
