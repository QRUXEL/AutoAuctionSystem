<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auction station</title>
<style>
  :root { --ink:#1b1b3a; --line:#d9d9e3; --bg:#f5f5f8; --ok:#1f7a4d; --warn:#b45309; --bad:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.45 system-ui,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--ink); color:#fff; padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; flex:1; }
  .pill { font-size:12px; padding:3px 9px; border-radius:99px; background:#fff2; white-space:nowrap; }
  .pill.warn { background:#f59e0b; color:#000; }
  nav { display:flex; gap:6px; padding:10px 16px; overflow-x:auto; }
  nav button { border:1px solid var(--line); background:#fff; border-radius:99px; padding:6px 14px; font:inherit; cursor:pointer; white-space:nowrap; }
  nav button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  main { padding:0 16px 40px; max-width:1100px; margin:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; }
  .card img, .card .ph { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#e8e8ef; }
  .card div.t { padding:8px 10px; font-size:14px; }
  .st { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .st.review { color:var(--warn); } .st.published { color:var(--ok); } .st.error { color:var(--bad); }
  .editor { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
  .photos { display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; }
  .photos img { height:220px; border-radius:6px; border:1px solid var(--line); }
  video { max-width:100%; max-height:260px; border-radius:6px; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 4px; }
  input, textarea, select { width:100%; font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px; }
  textarea { min-height:220px; }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .note { background:#fff7ed; border:1px solid #fed7aa; border-radius:8px; padding:10px 12px; margin:10px 0; font-size:14px; white-space:pre-wrap; }
  .note.bad { background:#fef3f2; border-color:#fecdca; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:10px 16px; font:inherit; cursor:pointer; }
  .btn.primary { background:var(--ok); color:#fff; border-color:var(--ok); font-weight:600; }
  .btn.danger { color:var(--bad); }
  .cats { border:1px solid var(--line); border-radius:8px; margin-top:4px; max-height:200px; overflow:auto; }
  .cats div { padding:7px 10px; cursor:pointer; font-size:14px; } .cats div:hover { background:var(--bg); }
  .empty { padding:40px 0; text-align:center; color:#667; }
  small.c { float:right; font-weight:400; color:#667; }
</style>
</head>
<body>
<header><h1>Auction station</h1><span id="mode" class="pill"></span></header>
<nav id="tabs"></nav>
<main id="main"></main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (path, opt = {}) => {
  const r = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...opt, body: opt.body ? JSON.stringify(opt.body) : undefined});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || data.error || r.statusText);
  return data;
};
const TABS = [['review', 'To review'], ['capturing', 'Incoming'], ['published', 'Published'], ['error', 'Problems'], ['', 'All']];
let tab = 'review', open = null, items = [], dirty = false;

async function refresh() {
  if (open && dirty) return;                       // never overwrite text someone is typing
  items = await api('/api/items');
  if (open) { const fresh = items.find(i => i.id === open.id); if (fresh && fresh.status !== open.status) { open = fresh; render(); } return; }
  render();
}

function render() {
  $('#tabs').innerHTML = TABS.map(([k, label]) => {
    const n = items.filter(i => !k || i.status === k || (k === 'capturing' && i.status === 'processing') || (k === 'published' && i.status === 'publishing')).length;
    return `<button class="${k === tab && !open ? 'on' : ''}" data-k="${k}">${label} (${n})</button>`;
  }).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.k; open = null; dirty = false; render(); });
  open ? renderEditor() : renderList();
}

function renderList() {
  const shown = items.filter(i => !tab || i.status === tab || (tab === 'capturing' && i.status === 'processing') || (tab === 'published' && i.status === 'publishing'));
  $('#main').innerHTML = shown.length ? `<div class="grid">${shown.map(i => `
    <div class="card" data-id="${i.id}">
      ${i.photos[0]?.framed ? `<img loading="lazy" src="${i.photos[0].framed}">` : '<div class="ph"></div>'}
      <div class="t"><span class="st ${i.status}">#${String(i.id).padStart(4, '0')} · ${i.status}</span><br>${esc(i.title) || '<i>No title yet</i>'}</div>
    </div>`).join('')}</div>` : '<div class="empty">Nothing here.</div>';
  document.querySelectorAll('.card').forEach(c => c.onclick = () => { open = items.find(i => i.id == c.dataset.id); render(); });
}

function renderEditor() {
  const i = open, locked = ['publishing', 'published', 'processing', 'capturing'].includes(i.status);
  $('#main').innerHTML = `<div class="editor">
    <span class="st ${i.status}">#${String(i.id).padStart(4, '0')} · ${i.status}</span>
    ${i.tradera_item_id ? ` · <a target="_blank" href="https://www.tradera.com/item/${i.tradera_item_id}">Tradera listing ${i.tradera_item_id}</a>` : ''}
    <div class="photos" style="margin-top:10px">${i.photos.map(p => `<a target="_blank" href="${p.framed || p.raw}"><img src="${p.framed || p.raw}"></a>`).join('')}</div>
    ${i.videos.map(v => `<video controls preload="metadata" src="${v}"></video> <a href="${v}" download>Download video</a>`).join('')}
    ${i.message ? `<div class="note bad">${esc(i.message)}</div>` : ''}
    ${i.ai_notes ? `<div class="note"><b>Check before publishing:</b> ${esc(i.ai_notes)}</div>` : ''}
    <label>Title <small class="c" id="tc"></small></label><input id="title" maxlength="80" value="${esc(i.title)}" ${locked ? 'disabled' : ''}>
    <label>Description</label><textarea id="description" ${locked ? 'disabled' : ''}>${esc(i.description)}</textarea>
    <label>Category</label>
    <input id="catq" placeholder="Search Tradera categories…" value="${esc(i.category_path)}" ${locked ? 'disabled' : ''}>
    <div id="cats"></div>
    <div class="row">
      <div><label>Start price (kr)</label><input id="start_price" type="number" min="1" value="${i.start_price ?? ''}" ${locked ? 'disabled' : ''}></div>
      <div><label>Buy now (kr)</label><input id="buy_now_price" type="number" min="1" value="${i.buy_now_price ?? ''}" ${locked ? 'disabled' : ''}></div>
      <div><label>Days</label><select id="duration_days" ${locked ? 'disabled' : ''}>${[3, 5, 7, 10, 14].map(d => `<option ${d == i.duration_days ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
    </div>
    <div class="actions">
      <button class="btn" id="back">← Back</button>
      ${locked ? '' : `<button class="btn" id="save">Save</button>
      <button class="btn primary" id="publish">Publish to Tradera</button>
      <button class="btn" id="regen">Redo photos + text</button>
      <button class="btn danger" id="del">Delete</button>`}
    </div></div>`;
  let cat = {id: i.category_id, path: i.category_path};
  const count = () => { if ($('#tc')) $('#tc').textContent = $('#title').value.length + '/80'; };
  count();
  document.querySelectorAll('.editor input, .editor textarea, .editor select').forEach(el => el.oninput = () => { dirty = true; count(); });
  $('#back').onclick = () => { open = null; dirty = false; refresh(); };
  if (locked) return;
  let timer;
  $('#catq').addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const found = await api('/api/categories?q=' + encodeURIComponent($('#catq').value)).catch(() => []);
      $('#cats').innerHTML = found.length ? `<div class="cats">${found.map(c => `<div data-id="${c.id}">${esc(c.path)}</div>`).join('')}</div>` : '';
      document.querySelectorAll('#cats [data-id]').forEach(d => d.onclick = () => { cat = {id: +d.dataset.id, path: d.textContent}; $('#catq').value = cat.path; $('#cats').innerHTML = ''; });
    }, 250);
  });
  const save = async () => {
    open = await api('/api/items/' + i.id, {method: 'PATCH', body: {
      title: $('#title').value, description: $('#description').value, category_id: cat.id, category_path: cat.path,
      start_price: $('#start_price').value, buy_now_price: $('#buy_now_price').value, duration_days: +$('#duration_days').value}});
    dirty = false;
  };
  const act = fn => async () => { try { await fn(); } catch (e) { alert(e.message); } };
  $('#save').onclick = act(async () => { await save(); render(); });
  $('#publish').onclick = act(async () => {
    await save();
    if (!confirm(info.dry_run ? 'Dry run: build the Tradera request without sending it?' : 'Publish this listing live on Tradera now?')) return;
    await api(`/api/items/${i.id}/publish`, {method: 'POST'}); open = null; await refresh();
  });
  $('#regen').onclick = act(async () => { if (confirm('Redo the framed photos and replace the text with a new AI draft?')) { await api(`/api/items/${i.id}/regenerate`, {method: 'POST'}); open = null; dirty = false; await refresh(); } });
  $('#del').onclick = act(async () => { if (confirm('Delete this item?')) { await api('/api/items/' + i.id, {method: 'DELETE'}); open = null; dirty = false; await refresh(); } });
}

let info = {};
(async () => {
  info = await api('/api/info');
  const m = $('#mode');
  m.textContent = info.dry_run ? 'Tradera: dry run' : 'Tradera: live';
  if (info.dry_run) m.classList.add('warn');
  await refresh();
  setInterval(() => refresh().catch(() => {}), 5000);
})();
</script>
</body>
</html>
